# Render Blueprint for the NestJS backend (CLAUDE.md Phase 6). Postgres is NOT defined here —
# the DB is Neon (its free tier doesn't expire, unlike Render's own free Postgres), connected
# via a manually-set DATABASE_URL below. Deploy by connecting this repo as a Blueprint in the
# Render dashboard; sync:false vars are prompted for at that point (blank is fine for the
# Google OAuth ones — see CLAUDE.md's Open Items).
services:
  - name: data-room-api
    type: web
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:nest
    startCommand: npm run start:nest
    # Runs once per deploy, after build and before the new version goes live — applies any
    # pending Prisma migrations (server/prisma/migrations) without generating new ones.
    preDeployCommand: npm run prisma:migrate:deploy
    envVars:
      - key: NODE_ENV
        value: production
      # Neon connection string (Dashboard > Connect) — includes sslmode=require already.
      - key: DATABASE_URL
        sync: false
      # Same Vercel Blob read/write token used locally (.env.example).
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      # Auto-generated by Render on first deploy — no need to run `openssl rand` by hand.
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # The deployed frontend's origin (Vercel URL), e.g. https://your-project.vercel.app —
      # required for CORS + Better Auth's trustedOrigins. Can be filled in after the Vercel
      # deploy exists; update it here and Render restarts the service automatically.
      - key: FRONTEND_ORIGIN
        sync: false
      # Leave both blank to launch without Google sign-in (auth.ts only registers the
      # provider when both are set) — fill in once the Google Cloud OAuth client exists.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # PORT is injected automatically by Render at runtime — do not set NEST_PORT here,
      # it would be ignored (server/src/main.ts prefers PORT when present).
